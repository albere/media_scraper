name: Test scrape

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        outlet:
        - "Daily Express"
        - "The Independent"
        - "Daily Star"
        include:
        - outlet: "The Guardian"
          guardian: true

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - run: pip install -r requirements.txt

    - name: Test scrape - ${{ matrix.outlet }}
      env:
        GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
      run: |
        if [[ "${{ matrix.guardian }}" == "true" ]]; then
            python guardian_corpus.py \
                --year-start 2010 --year-end 2011 \
                --month-start 1 --month-end 2
        else
            python scraper.py "${{ matrix.outlet }}" \
                --year-start 2010 --year-end 2011 \
                --month-start 1 --month-end 2 \
                --crawl-delay .0001 \
                --domain-concurrency 4 \
                --parse-workers 4 \
                --batch-size 50
        fi

    - name: Show results
      if: always()
      run: |
        echo "=== URL queue ==="
        wc -l *_url_queue.csv 2>/dev/null || echo "No queue file"
        echo "=== Corpus ==="
        wc -l *_corpus.csv 2>/dev/null || echo "No corpus file"

    - name: Compute checksums
      if: always()
      run: |
        echo "=== SHA256 checksums ==="
        sha256sum *_url_queue.csv *_corpus.csv 2>/dev/null | sort | tee checksums.txt || true
        if [ ! -s checksums.txt ]; then
          echo "No files to checksum"
        fi

    - name: Regression check
      if: always()
      run: |
        SLUG="${{ matrix.outlet }}"
        SLUG="${SLUG,,}"
        SLUG="${SLUG// /_}"
        BASELINE=".github/workflows/checksums/${SLUG}.sha256"
        if [ ! -s checksums.txt ]; then
          echo "::warning::checksums.txt is missing or empty — skipping regression check"
        elif [ ! -f "$BASELINE" ]; then
          echo "::warning::No baseline found at $BASELINE — commit checksums.txt as $BASELINE to enable regression checks"
        elif diff "$BASELINE" checksums.txt > /tmp/checksum_diff.txt; then
          echo "✓ Checksums match baseline ($BASELINE)"
        else
          echo "::warning::Checksums differ from baseline ($BASELINE). Update $BASELINE if this change is intentional."
          echo "--- diff (baseline vs current) ---"
          cat /tmp/checksum_diff.txt
        fi

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-${{ matrix.outlet }}
        path: |
          *_url_queue.csv
          *_corpus.csv

    - name: Upload checksums
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: checksums-${{ matrix.outlet }}
        path: checksums.txt
